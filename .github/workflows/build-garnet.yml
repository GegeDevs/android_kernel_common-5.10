name: Build Garnet Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CLANG_VERSION: clang-r416183b
  KSU_NEXT_REF: v3.1.0-legacy-susfs

jobs:
  build-kernel:
    name: Build Garnet Kernel (KSU-Next legacy-susfs + SusFS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: garnet-custom
          path: kernel/common

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex git \
            libncurses-dev libssl-dev python3 python3-pip \
            python3-venv rsync schedtool squashfs-tools \
            xsltproc zip libxml2-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup AOSP Clang r416183b
        run: |
          git clone --depth 1 -b android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            /tmp/clang-repo || {
              # fallback: shallow fetch only needed subtree via sparse checkout
              git clone --depth 1 --filter=blob:none --sparse \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                /tmp/clang-repo
              cd /tmp/clang-repo
              git sparse-checkout set ${CLANG_VERSION}
          }
          test -d "/tmp/clang-repo/${CLANG_VERSION}/bin" || { echo "Clang ${CLANG_VERSION} missing"; exit 1; }
          "/tmp/clang-repo/${CLANG_VERSION}/bin/clang" --version

      - name: Setup KernelSU-Next (v3.1.0-legacy-susfs)
        working-directory: kernel/common
        run: |
          set -e
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout ${KSU_NEXT_REF}
          echo "KSU-Next version: $(git describe --tags)"
          cd ..

          # Wire into drivers (same as kernel/setup.sh, but pinned to the tag)
          ln -sf "$(realpath --relative-to=drivers KernelSU-Next/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -e drivers/kernelsu/Kconfig || { echo "KernelSU-Next symlink missing"; exit 1; }
          echo "=== KernelSU-Next ready ==="

      - name: Apply SusFS v2.0.0 (vendored @ 5dadad4)
        working-directory: kernel/common
        run: |
          set -e
          cp susfs_patches/susfs/fs/susfs.c fs/
          cp susfs_patches/susfs/include/linux/susfs.h include/linux/
          cp susfs_patches/susfs/include/linux/susfs_def.h include/linux/

          echo "=== Applying SusFS kernel patch ==="
          git apply susfs_patches/susfs/50_add_susfs_in_gki-android12-5.10.patch

          echo "=== Adding ksu_handle_vfs_fstat to KSU-Next legacy ksud.c ==="
          cd KernelSU-Next
          git apply ../susfs_patches/susfs/ksu-next-legacy_add_ksu_handle_vfs_fstat.patch
          grep -q "ksu_handle_vfs_fstat" kernel/ksud.c || { echo "vfs_fstat hook missing"; exit 1; }
          cd ..

          echo "=== SusFS applied ==="
          ls fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

      - name: Enable KSU + SusFS in config
        working-directory: kernel/common
        run: |
          grep -E "^CONFIG_KSU" arch/arm64/configs/garnet_defconfig

      - name: Build kernel (Image.lz4 + modules)
        working-directory: kernel/common
        run: |
          set -o pipefail
          export PATH="/tmp/clang-repo/${CLANG_VERSION}/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export LLVM=1 LLVM_IAS=1

          echo "=== defconfig ==="
          make O=out garnet_defconfig

          echo "=== verify susfs config took effect ==="
          grep -E "CONFIG_KSU(_SUSFS)?[= ]|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS_TRY_UMOUNT" out/.config | head -20

          echo "=== build ==="
          make O=out -j$(nproc) Image.lz4 modules 2>&1 | tail -n 400

          echo "=== verify artifacts ==="
          test -f out/arch/arm64/boot/Image.lz4 || { echo "FATAL: Image.lz4 not produced"; exit 1; }
          ls -la out/arch/arm64/boot/Image.lz4
          find out -name "*.ko" | head -20

      - name: Package with AnyKernel3
        run: |
          set -e
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          cd /tmp/ak3 && rm -rf .git .github README.md

          cp kernel/common/out/arch/arm64/boot/Image.lz4 .

          mkdir -p modules/system/lib/modules
          find kernel/common/out -name "zram.ko" -exec cp {} modules/system/lib/modules/ \;
          find kernel/common/out -name "zsmalloc.ko" -exec cp {} modules/system/lib/modules/ \;
          ls -la modules/system/lib/modules/

          # AK3 config: enable module install, label kernel
          sed -i 's/^do.modules=.*/do.modules=1/' anykernel.sh
          sed -i 's|^kernel.string=.*|kernel.string=Garnet-KSU-Next-SusFS-5.10|' anykernel.sh
          grep -E "^(do.modules|kernel.string)" anykernel.sh

          cd /tmp/ak3
          zip -r9 "${GITHUB_WORKSPACE}/AnyKernel3-garnet.zip" . -x ".git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-garnet
          path: AnyKernel3-garnet.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: garnet-ksu-next-susfs-${{ github.run_number }}
          name: Garnet Kernel KSU-Next + SusFS ${{ github.run_number }}
          files: AnyKernel3-garnet.zip
          body: |
            Custom kernel for Garnet (Redmi Note 13 Pro 5G)

            Features:
            - KernelSU-Next v3.1.0-legacy-susfs (manual hooks)
            - SusFS v2.0.0 (gki-android12-5.10 @ 5dadad4)
            - zram (lz4) + zsmalloc modules included
            - Built with AOSP Clang r416183b / LLD

            Based on android12-5.10 GKI kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
