name: Build Garnet Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Garnet Kernel (KSU-Next + SusFS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: garnet-custom
          path: kernel/common

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git \
            libncurses-dev libssl-dev python3 python3-pip \
            python3-venv rsync schedtool squashfs-tools \
            xsltproc zip libxml2-dev

      - name: Setup AOSP Clang
        run: |
          git clone --depth 1 -b android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            /tmp/clang
          # Find the specific clang version directory
          CLANG_DIR=$(find /tmp/clang -maxdepth 1 -name "clang-r*" -type d | head -1)
          if [ -n "$CLANG_DIR" ]; then
            echo "$CLANG_DIR/bin" >> $GITHUB_PATH
            export PATH="$CLANG_DIR/bin:$PATH"
            clang --version
          else
            echo "Clang not found, using system clang"
          fi

      - name: Setup AOSP GCC
        run: |
          git clone --depth 1 -b android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            /tmp/gcc64
          
          git clone --depth 1 -b android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            /tmp/gcc32
          
          echo "/tmp/gcc64/bin" >> $GITHUB_PATH
          echo "/tmp/gcc32/bin" >> $GITHUB_PATH

      - name: Setup KernelSU-Next
        working-directory: kernel
        run: |
          echo "=== Downloading KernelSU-Next setup script ==="
          curl -sSLf https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh -o ksu_setup.sh
          echo "=== Running KernelSU-Next setup ==="
          cd common
          bash ../ksu_setup.sh stable
          echo "=== KernelSU-Next installed ==="
          ls -la ../KernelSU-Next/ 2>/dev/null || echo "KernelSU-Next directory not found"
          ls -la drivers/kernelsu 2>/dev/null || echo "drivers/kernelsu symlink not found"

      - name: Apply SusFS4KSU patches
        working-directory: kernel
        run: |
          echo "=== Cloning SusFS4KSU ==="
          git clone --depth 1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          
          cd common
          
          echo "=== Copying SusFS source files ==="
          cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          echo "=== Applying SusFS kernel patch ==="
          git apply --stat /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
          git apply /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || {
            echo "=== Patch did not apply cleanly, trying with --reject ==="
            git apply --reject /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
          }
          
          echo "=== Copying SusFS KernelSU patch ==="
          cp /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/
          
          echo "=== Applying SusFS KernelSU patch ==="
          cd KernelSU-Next
          git apply --stat 10_enable_susfs_for_ksu.patch || true
          git apply 10_enable_susfs_for_ksu.patch || {
            echo "=== KernelSU patch did not apply cleanly, trying with --reject ==="
            git apply --reject 10_enable_susfs_for_ksu.patch || true
          }
          cd ..
          
          echo "=== SusFS patches applied ==="
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

      - name: Enable SusFS in config
        working-directory: kernel/common
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/garnet_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/garnet_defconfig
          echo "=== Config updated ==="
          grep "KSU" arch/arm64/configs/garnet_defconfig

      - name: Build kernel
        working-directory: kernel/common
        run: |
          export PATH="/tmp/clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
          
          echo "=== Starting kernel build ==="
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            garnet_defconfig
          
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc) 2>&1 | tee build.log
          
          echo "=== Build completed ==="
          ls -la arch/arm64/boot/Image* 2>/dev/null || echo "Image not found"

      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git /tmp/anykernel3
          
          cd /tmp/anykernel3
          rm -rf .git
          
          cp kernel/common/arch/arm64/boot/Image.gz-dtb /tmp/anykernel3/ 2>/dev/null || \
          cp kernel/common/arch/arm64/boot/Image.lz4 /tmp/anykernel3/ 2>/dev/null || \
          cp kernel/common/arch/arm64/boot/Image /tmp/anykernel3/ 2>/dev/null || \
          echo "No boot image found"
          
          cd /tmp
          zip -r9 ${GITHUB_WORKSPACE}/AnyKernel3-garnet.zip anykernel3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-garnet
          path: AnyKernel3-garnet.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: garnet-ksu-next-susfs-${{ github.run_number }}
          name: Garnet Kernel KSU-Next + SusFS ${{ github.run_number }}
          files: AnyKernel3-garnet.zip
          body: |
            Custom kernel for Garnet (Redmi Note 13 Pro 5G)
            
            Features:
            - KernelSU-Next (stable)
            - SusFS4KSU support
            - Built with AOSP Clang
            
            Based on android12-5.10 GKI kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
